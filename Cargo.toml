[package]
name = "oui-lookup"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["yabowarcherio <yabowarcher8590@gmail.com>"]
description = "Fast, offline MAC-address vendor (OUI) lookup — embedded IEEE database, zero runtime dependencies, library + CLI."
documentation = "https://docs.rs/oui-lookup"
repository = "https://github.com/yabowarcherio/oui-lookup"
homepage = "https://github.com/yabowarcherio/oui-lookup"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["mac", "oui", "ieee", "vendor", "network"]
categories = ["network-programming", "command-line-utilities", "database"]
exclude = [
    ".github/",
    "scripts/",
    "benches/",
    "tests/fixtures/",
]

[lib]
name = "oui_lookup"
path = "src/lib.rs"

[[bin]]
name = "oui-lookup"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The CLI binary. Disable for a slim library-only dependency.
cli = ["dep:clap", "dep:serde", "dep:serde_json"]
# Derive serde traits on the public `Vendor` type.
serde = ["dep:serde"]

[dependencies]
# Decompresses the embedded OUI table at first use.
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[build-dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "lookup"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
